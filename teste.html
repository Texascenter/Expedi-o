<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Texas Flow — Gestão de Recebimento, Cadastro e Publicação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --saddle:#3a2a1c;
  --saddle-2:#2c1f14;
  --saddle-3:#241a11;
  --bran:#f4efe5;
  --paper:#fbf8f1;
  --card:#ffffff;
  --ink:#2a2017;
  --ink-2:#6f6354;
  --ink-3:#9c8f7d;
  --line:#e7ddcb;
  --line-2:#efe7d8;
  --ferro:#b8521a;      /* branding-iron copper */
  --ferro-2:#933f12;
  --tan:#d9a441;        /* warm tan */
  /* status tones */
  --ok:#2f7d4f;        --ok-bg:#e7f2ea;
  --warn:#a76b00;      --warn-bg:#faf0d6;
  --amber:#9a6326;     --amber-bg:#f4e6d2;
  --danger:#b3261e;    --danger-bg:#fbe5e2;
  --process:#3a5d80;   --process-bg:#e6eef4;
  --pc:#6a4aa0;        --pc-bg:#efe9f8;
  --shadow:0 1px 2px rgba(46,33,20,.06), 0 8px 24px -16px rgba(46,33,20,.28);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  background:var(--bran);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
  line-height:1.45;
}
.mono{font-family:"IBM Plex Mono",monospace}
.osw{font-family:"Oswald",sans-serif}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}

/* ---------- sidebar ---------- */
.side{
  background:linear-gradient(180deg,var(--saddle) 0%,var(--saddle-2) 60%,var(--saddle-3) 100%);
  color:#e9ddca;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  border-right:1px solid #1d150d;z-index:40;
}
.brand{padding:18px 18px 14px;display:flex;gap:11px;align-items:center;
  border-bottom:1px dashed rgba(233,221,202,.22);position:relative}
.brand-mark{
  width:42px;height:42px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(160deg,var(--ferro),var(--ferro-2));
  color:#fff;font-family:"Oswald";font-weight:700;font-size:18px;letter-spacing:.5px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18), 0 4px 10px -4px rgba(0,0,0,.5);
}
.brand-txt b{font-family:"Oswald";font-weight:600;font-size:16px;letter-spacing:.6px;color:#fff;display:block;line-height:1.05}
.brand-txt span{font-size:11px;color:#b8a585;letter-spacing:.3px}

.nav{flex:1;overflow-y:auto;padding:10px 10px 16px;scrollbar-width:thin;scrollbar-color:#5a4530 transparent}
.nav::-webkit-scrollbar{width:7px}
.nav::-webkit-scrollbar-thumb{background:#5a4530;border-radius:8px}
.nav-group{font-family:"Oswald";font-weight:500;font-size:10.5px;letter-spacing:2px;
  text-transform:uppercase;color:#9b8767;padding:14px 10px 6px}
.nav-item{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;
  color:#ddcfb9;text-align:left;cursor:pointer;padding:7px 9px;border-radius:8px;font:inherit;
  font-size:13px;transition:background .15s,color .15s;position:relative}
.nav-item:hover{background:rgba(233,221,202,.08);color:#fff}
.nav-item.active{background:rgba(184,82,26,.20);color:#fff}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:3px;
  border-radius:0 3px 3px 0;background:var(--ferro)}
.sigla{width:26px;height:26px;flex:0 0 auto;border-radius:6px;display:grid;place-items:center;
  font-family:"Oswald";font-weight:600;font-size:11px;letter-spacing:.5px;
  background:#1f160d;color:#cdb892;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.nav-item.active .sigla{background:var(--ferro);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.nav-item:hover .sigla{color:#f0e4cf}

.side-user{border-top:1px dashed rgba(233,221,202,.22);padding:12px 14px;display:flex;gap:10px;align-items:center}
.avatar{width:34px;height:34px;border-radius:8px;background:#1f160d;display:grid;place-items:center;
  font-family:"Oswald";font-weight:600;color:#cdb892;font-size:13px}
.side-user .u b{display:block;font-size:13px;color:#fff;line-height:1.1}
.side-user .u span{font-size:11px;color:#a8916f}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:30;background:rgba(251,248,241,.86);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:13px 26px;display:flex;align-items:center;gap:18px}
.tb-title{min-width:0;flex:1}
.eyebrow{font-family:"Oswald";font-weight:500;font-size:11px;letter-spacing:2.4px;text-transform:uppercase;color:var(--ferro)}
.tb-title h1{margin:1px 0 0;font-family:"Oswald";font-weight:600;font-size:21px;letter-spacing:.3px;color:var(--ink);line-height:1.15}
.tb-title p{margin:0;font-size:12.5px;color:var(--ink-2)}
.tb-tools{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.search{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
  border-radius:9px;padding:7px 11px;width:210px;transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--ferro);box-shadow:0 0 0 3px rgba(184,82,26,.12)}
.search svg{flex:0 0 auto}
.search input{border:0;outline:0;background:transparent;font:inherit;font-size:13px;width:100%;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.btn{font:inherit;font-size:13px;cursor:pointer;border-radius:9px;padding:8px 13px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);display:inline-flex;gap:7px;align-items:center;
  transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:#fff;border-color:#d8cbb4}
.btn:active{transform:translateY(1px)}
.btn-period{font-family:"IBM Plex Sans"}
.btn-primary{background:var(--ferro);border-color:var(--ferro);color:#fff}
.btn-primary:hover{background:var(--ferro-2);border-color:var(--ferro-2)}
.hamb{display:none}

.scroll{overflow-y:auto}
.view{padding:24px 26px 60px;animation:fade .28s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* content layout: body + map rail */
.content{display:grid;grid-template-columns:1fr 272px;gap:22px;align-items:start}
.content.full{grid-template-columns:1fr}

/* ---------- KPI cards ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 16px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,var(--ferro))}
.kpi .lab{font-family:"Oswald";font-weight:500;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink-2)}
.kpi .val{font-family:"Oswald";font-weight:700;font-size:33px;line-height:1.02;color:var(--ink);margin-top:6px;
  font-variant-numeric:tabular-nums}
.kpi .val .u{font-size:15px;font-weight:600;color:var(--ink-2);margin-left:2px}
.kpi .sub{font-size:12px;color:var(--ink-2);margin-top:3px}

/* ---------- panel/table ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.panel-head{padding:13px 16px;border-bottom:1px solid var(--line-2);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.panel-head h2{margin:0;font-family:"Oswald";font-weight:600;font-size:15px;letter-spacing:.3px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:inherit;font-size:12.5px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink-2);
  padding:5px 12px;border-radius:20px;transition:all .14s}
.chip:hover{border-color:#d4c6ac;color:var(--ink)}
.chip.on{background:var(--saddle);border-color:var(--saddle);color:#f3e9d8}

.info{margin:0;padding:12px 16px;background:linear-gradient(0deg,#fff,#fdfaf3);border-bottom:1px solid var(--line-2);
  font-size:13px;color:var(--ink-2);display:flex;gap:10px;align-items:flex-start}
.info b{color:var(--ink)}
.info .ico{flex:0 0 auto;color:var(--ferro);margin-top:1px}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
thead th{font-family:"Oswald";font-weight:500;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;
  color:var(--ink-2);text-align:left;padding:11px 14px;background:#faf6ee;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:12px 14px;border-bottom:1px solid var(--line-2);font-size:13px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer;transition:background .12s}
tbody tr.clickable:hover{background:#fbf7ef}
td.mono,th.mono{font-family:"IBM Plex Mono";font-size:12.5px}
.grade{font-family:"IBM Plex Mono";font-size:12px;color:var(--ink-2)}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3.5px 9px;border-radius:7px;
  white-space:nowrap;line-height:1.3}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
.b-ok{color:var(--ok);background:var(--ok-bg)}
.b-warn{color:var(--warn);background:var(--warn-bg)}
.b-amber{color:var(--amber);background:var(--amber-bg)}
.b-danger{color:var(--danger);background:var(--danger-bg)}
.b-process{color:var(--process);background:var(--process-bg)}
.b-pc{color:var(--pc);background:var(--pc-bg)}
.b-muted{color:var(--ink-2);background:#f1ebdf}

.alert-warn{color:var(--danger);font-weight:600;font-size:12.5px;display:inline-flex;gap:5px;align-items:center}
.alert-ok{color:var(--ok);font-weight:600;font-size:13px}
.cell-num{font-family:"IBM Plex Mono";font-weight:600}

.act{font:inherit;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:#fff;
  color:var(--ferro);padding:5px 11px;border-radius:7px;transition:all .14s}
.act:hover{background:var(--ferro);border-color:var(--ferro);color:#fff}
.yn-yes{color:var(--ok);font-weight:600}
.yn-no{color:var(--ink-3)}

/* confidence bar */
.conf{display:flex;align-items:center;gap:8px}
.conf .track{width:54px;height:6px;border-radius:4px;background:#eee3cf;overflow:hidden}
.conf .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--tan),var(--ferro))}
.conf .pct{font-family:"IBM Plex Mono";font-size:12px;font-weight:600;color:var(--ink)}

/* ---------- map rail ---------- */
.map{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;
  position:sticky;top:90px}
.map-head{padding:12px 15px;border-bottom:1px solid var(--line-2);display:flex;gap:9px;align-items:center;
  background:linear-gradient(0deg,#fff,#fdf9f1)}
.map-head .pin{width:24px;height:24px;border-radius:6px;background:var(--saddle);color:#f0e4cf;display:grid;place-items:center}
.map-head b{font-family:"Oswald";font-weight:600;font-size:13px;letter-spacing:.4px}
.map-head span{display:block;font-size:11px;color:var(--ink-2)}
.map ol{margin:0;padding:8px 6px;list-style:none;counter-reset:m}
.map li{counter-increment:m;display:flex;gap:11px;padding:9px 10px;border-radius:9px;font-size:12.5px;color:var(--ink-2);line-height:1.4}
.map li:hover{background:#fbf7ef}
.map li::before{content:counter(m);flex:0 0 auto;width:21px;height:21px;border-radius:6px;background:#f0e8d8;
  color:var(--ferro);font-family:"Oswald";font-weight:600;font-size:11px;display:grid;place-items:center;margin-top:1px}

.note{margin-top:16px;font-size:12.5px;color:var(--ink-2);background:#fdf6e9;border:1px dashed #e6cf9f;
  border-radius:10px;padding:11px 14px;display:flex;gap:9px;align-items:flex-start}
.note b{color:var(--ferro-2);font-family:"Oswald";font-weight:600;letter-spacing:.3px}

/* flow strip */
.flowstrip{display:flex;flex-wrap:wrap;gap:0;align-items:center;padding:14px 16px;background:#faf6ee;border-bottom:1px solid var(--line-2)}
.fchip{font-family:"Oswald";font-weight:500;font-size:12px;letter-spacing:.4px;background:#fff;border:1px solid var(--line);
  padding:6px 13px;border-radius:8px;color:var(--ink)}
.farrow{color:var(--ink-3);margin:0 4px}

/* ===== cover ===== */
.cover{max-width:1080px;margin:0 auto}
.hero{background:linear-gradient(150deg,var(--saddle) 0%,var(--saddle-2) 100%);color:#f1e6d3;border-radius:18px;
  padding:42px 40px;position:relative;overflow:hidden;box-shadow:0 20px 50px -28px rgba(40,28,16,.7)}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 88% 12%,rgba(184,82,26,.30),transparent 42%);pointer-events:none}
.hero-eye{font-family:"Oswald";font-weight:500;letter-spacing:3px;font-size:12px;text-transform:uppercase;color:var(--tan)}
.hero h1{font-family:"Oswald";font-weight:700;font-size:clamp(30px,5vw,52px);line-height:1.02;margin:14px 0 0;letter-spacing:.5px;color:#fff;max-width:18ch}
.hero h1 em{font-style:normal;color:var(--tan)}
.hero p{max-width:62ch;color:#d8c8ad;font-size:15px;margin:16px 0 0}
.hero-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.htag{font-family:"IBM Plex Mono";font-size:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
  padding:6px 11px;border-radius:8px;color:#ecdfc8}
.hero-cta{margin-top:26px;display:flex;flex-wrap:wrap;gap:11px}
.cover-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:22px}
.pillar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.pillar .pn{width:34px;height:34px;border-radius:9px;background:var(--ferro);color:#fff;display:grid;place-items:center;
  font-family:"Oswald";font-weight:700;margin-bottom:11px}
.pillar h3{font-family:"Oswald";font-weight:600;font-size:15px;margin:0 0 5px;letter-spacing:.3px}
.pillar p{margin:0;font-size:13px;color:var(--ink-2)}

/* ===== flow map ===== */
.flowmap{display:grid;gap:18px}
.flowcard{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.flowcard-h{padding:13px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:11px}
.flowcard-h .tag{font-family:"Oswald";font-weight:600;font-size:11px;letter-spacing:1px;text-transform:uppercase;
  padding:4px 10px;border-radius:7px}
.tag-nac{background:var(--process-bg);color:var(--process)}
.tag-imp{background:var(--pc-bg);color:var(--pc)}
.flowcard-h b{font-family:"Oswald";font-weight:600;font-size:15px}
.flowcard-h span{font-size:12.5px;color:var(--ink-2)}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:0;padding:20px 18px}
.step{display:flex;align-items:center}
.step .node{font-family:"Oswald";font-weight:500;font-size:13px;letter-spacing:.3px;background:#faf6ee;border:1px solid var(--line);
  padding:9px 14px;border-radius:9px;color:var(--ink);white-space:nowrap}
.step.start .node{background:var(--saddle);border-color:var(--saddle);color:#f1e6d3}
.step.start.imp .node{background:var(--pc);border-color:var(--pc);color:#fff}
.step.end .node{background:var(--ok-bg);border-color:#bfe0cb;color:var(--ok)}
.step .arr{color:var(--ferro);margin:0 7px;font-size:16px}
.flowcard .sub-row{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px}
.sub-row .lane{display:flex;flex-wrap:wrap;align-items:center;gap:0}
.sub-row .lane-lab{font-family:"Oswald";font-weight:500;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--ink-2);width:100%;margin-bottom:4px}

/* ===== nf detail ===== */
.nfhead{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px}
.nfhead .top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.nfhead h2{font-family:"Oswald";font-weight:700;font-size:22px;margin:0;letter-spacing:.4px}
.nfhead .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.timeline{display:flex;flex-wrap:wrap;align-items:center;gap:0;margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.tl{display:flex;align-items:center}
.tl .pt{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:62px}
.tl .pt .ring{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);background:#fff}
.tl .pt.done .ring{background:var(--ok);border-color:var(--ok)}
.tl .pt.now .ring{background:var(--ferro);border-color:var(--ferro);box-shadow:0 0 0 4px rgba(184,82,26,.18)}
.tl .pt small{font-family:"Oswald";font-weight:500;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-2)}
.tl .pt.done small,.tl .pt.now small{color:var(--ink)}
.tl .seg{width:34px;height:2px;background:var(--line);margin-bottom:18px}
.tl .seg.done{background:var(--ok)}
.histbar{margin-top:16px;background:#faf6ee;border:1px solid var(--line);border-radius:11px;padding:12px 15px;font-size:12.5px;color:var(--ink-2)}
.histbar b{font-family:"Oswald";font-weight:600;color:var(--ink);display:block;margin-bottom:5px;letter-spacing:.3px}
.histbar .ev{display:inline-flex;gap:6px;align-items:baseline;margin-right:6px}
.histbar .t{font-family:"IBM Plex Mono";color:var(--ferro-2);font-weight:600}

/* fiscal actions */
.actions{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line-2);background:#faf6ee}
.fa{font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);
  padding:7px 13px;border-radius:8px;transition:all .14s}
.fa:hover{border-color:var(--ferro);color:var(--ferro)}
.fa.go{background:var(--ferro);border-color:var(--ferro);color:#fff}
.fa.go:hover{background:var(--ferro-2)}
.fa.warn{border-color:#e3c089;color:var(--amber)}

/* MC chart */
.chartwrap{padding:20px 18px}
.legend{display:flex;gap:18px;justify-content:center;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--saddle);color:#f1e6d3;
  padding:11px 18px;border-radius:11px;font-size:13px;box-shadow:0 14px 34px -14px rgba(0,0,0,.6);opacity:0;
  transition:opacity .25s,transform .25s;z-index:80;display:flex;gap:9px;align-items:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .dotc{width:7px;height:7px;border-radius:50%;background:var(--tan)}

.scrim{display:none}

@media (max-width:1100px){
  .content{grid-template-columns:1fr}
  .map{position:static}
}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;width:264px;transform:translateX(-100%);transition:transform .25s}
  .side.open{transform:none}
  .scrim{display:none;position:fixed;inset:0;background:rgba(30,20,10,.45);z-index:35}
  .scrim.show{display:block}
  .hamb{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);
    background:#fff;cursor:pointer;flex:0 0 auto}
  .topbar{padding:12px 16px;gap:10px}
  .tb-title h1{font-size:18px}
  .search{width:auto;flex:1;min-width:0}
  .view{padding:18px 16px 50px}
  .btn-period span{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="brand">
      <div class="brand-mark">TX</div>
      <div class="brand-txt"><b>Texas Flow</b><span>Cadastro de Produtos</span></div>

/* ============================================================ HELPERS ============================================================ */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=s=>String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));

function toneClass(text){
  const t=(text||"").toString().toLowerCase().trim();
  if(!t||t==="—"||t==="n/a") return "b-muted";
  if(/diverg|^aberta$|piorando|pendente|bloque|crític/.test(t)) return "b-danger";
  if(/adiad|atras|aguardar fornecedor|negocia|^novo$/.test(t)) return "b-amber";
  if(/aguardando|análise|analise|revis|^rev$|andamento|editando|fornecedor$/.test(t)) return "b-warn";
  if(/conclu|conferid|publicad|resolvid|liberad|melhorando|^ok$|estável|estavel|pronto|normal|^ativo$|excel|^csv$|loja liberada/.test(t)) return "b-ok";
  if(/pré-cadastro|pre-cadastro|sugerid|vínculo|vinculo|pc\d/.test(t)) return "b-pc";
  return "b-process";
}
function cell(val,type){
  const v=esc(val??"");
  switch(type){
    case "mono": return `<td class="mono">${v}</td>`;
    case "grade": return `<td><span class="grade">${v}</span></td>`;
    case "money": return `<td class="mono">${v}</td>`;
    case "text": return `<td>${v}</td>`;
    case "badge":
      if(!val) return `<td></td>`;
      return `<td><span class="badge ${toneClass(val)}"><span class="dot"></span>${v}</span></td>`;
    case "alert":{
      if(!val) return `<td></td>`;
      const s=String(val);
      if(s.startsWith("⚠")) return `<td><span class="alert-warn">⚠ ${esc(s.replace(/^⚠\s*/,""))}</span></td>`;
      if(s.includes("✓")) return `<td><span class="alert-ok">✓ conferido</span></td>`;
      if(/adiad/i.test(s)) return `<td><span class="badge b-amber"><span class="dot"></span>${v}</span></td>`;
      if(/aguard/i.test(s)) return `<td><span class="badge b-warn"><span class="dot"></span>${v}</span></td>`;
      return `<td>${v}</td>`;
    }
    case "conf":{
      if(!val||val==="—") return `<td>—</td>`;
      const n=parseInt(val,10)||0;
      return `<td><div class="conf"><span class="track"><span class="fill" style="width:${n}%"></span></span><span class="pct">${v}</span></div></td>`;
    }
    case "impact":{
      const m={"alto":"b-danger","médio":"b-amber","medio":"b-amber","baixo":"b-ok","retrabalho":"b-process"};
      return `<td><span class="badge ${m[(val||"").toLowerCase()]||"b-muted"}"><span class="dot"></span>${v}</span></td>`;
    }
    case "trend":{
      const t=(val||"").toLowerCase();
      const cls=/melhorando/.test(t)?"b-ok":/piorando/.test(t)?"b-danger":"b-process";
      const ar=/melhorando/.test(t)?"↓":/piorando/.test(t)?"↑":"→";
      return `<td><span class="badge ${cls}">${ar} ${v}</span></td>`;
    }
    case "yn":
      return /sim/i.test(val)?`<td><span class="yn-yes">✓ Sim</span></td>`:`<td><span class="yn-no">— Não</span></td>`;
    case "act":
      return `<td><button class="act" data-act>${v}</button></td>`;
    default: return `<td>${v}</td>`;
  }
}

function buildTable(s){
  const wrap=el("div","panel");
  // head + filters
  const head=el("div","panel-head");
  head.appendChild(el("h2",null,s.title));
  if(s.filters){
    const chips=el("div","chips");
    s.filters.forEach((f,i)=>{
      const c=el("button","chip"+(i===0?" on":""),f);
      c.onclick=()=>{chips.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");applyFilter(s,f,wrap);};
      chips.appendChild(c);
    });
    head.appendChild(chips);
  }
  if(s.extraBtn){
    const b=el("button","act",s.extraBtn.label);
    b.onclick=()=>go(s.extraBtn.go);
    head.appendChild(b);
  }
  wrap.appendChild(head);

  if(s.reportFilters){
    const f=el("div","flowstrip");
    f.style.justifyContent="space-between";
    const left=el("div","chips");
    ["Hoje","Semana","Mês","Ano","Personalizado"].forEach((p,i)=>{
      const c=el("button","chip"+(i===2?" on":""),p);
      c.onclick=()=>{left.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");};
      left.appendChild(c);
    });
    const right=el("div","chips");
    ["Excel","PDF","CSV"].forEach(p=>{const c=el("button","chip",p);c.onclick=()=>toast("Relatório exportado em "+p);right.appendChild(c);});
    f.appendChild(left);f.appendChild(right);
    wrap.appendChild(f);
  }
  if(s.info){
    wrap.appendChild(el("p","info",
      `<span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5h.01"/></svg></span><span><b>${esc(s.info.b)}</b> ${esc(s.info.t)}</span>`));
  }
  if(s.flow){
    const f=el("div","flowstrip");
    s.flow.forEach((n,i)=>{f.appendChild(el("span","fchip",esc(n)));if(i<s.flow.length-1)f.appendChild(el("span","farrow","→"));});
    wrap.appendChild(f);
  }
  if(s.actions){
    const a=el("div","actions");
    s.actions.forEach(x=>{const b=el("button","fa"+(x.cls?" "+x.cls:""),esc(x.l));b.onclick=()=>toast("Ação registrada: "+x.l);a.appendChild(b);});
    wrap.appendChild(a);
  }

  // table
  const tw=el("div","tbl-wrap");
  const tbl=el("table");
  const thead=el("thead");
  const trh=el("tr");
  s.cols.forEach(c=>trh.appendChild(el("th",c.t==="mono"?"mono":null,esc(c.k))));
  thead.appendChild(trh);tbl.appendChild(thead);
  const tbody=el("tbody");tbody.id="tbody";
  s.rows.forEach(r=>{
    const tr=el("tr");
    if(s.openDetail){tr.className="clickable";tr.onclick=e=>{if(!e.target.closest("[data-act]"))go("nfdetail");};}
    tr.innerHTML=s.cols.map((c,i)=>cell(r[i],c.t)).join("");
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);tw.appendChild(tbl);wrap.appendChild(tw);
  wrap.querySelectorAll("[data-act]").forEach(b=>b.onclick=e=>{e.stopPropagation();toast("Abrindo: "+b.textContent);});
  return wrap;
}

function applyFilter(s,f,wrap){
  const tbody=wrap.querySelector("#tbody");tbody.innerHTML="";
  const pred=s.rowFilter?s.rowFilter():null;
  s.rows.filter(r=>{if(f==="Todos"||!pred)return true;const p=s.rowFilter(r);return p[f];}).forEach(r=>{
    const tr=el("tr");
    if(s.openDetail){tr.className="clickable";tr.onclick=e=>{if(!e.target.closest("[data-act]"))go("nfdetail");};}
    tr.innerHTML=s.cols.map((c,i)=>cell(r[i],c.t)).join("");
    tbody.appendChild(tr);
  });
  wrap.querySelectorAll("[data-act]").forEach(b=>b.onclick=e=>{e.stopPropagation();toast("Abrindo: "+b.textContent);});
}

function buildKpis(kpis){
  const g=el("div","kpis");
  const tmap={ok:"var(--ok)",warn:"var(--warn)",amber:"var(--amber)",danger:"var(--danger)",process:"var(--process)",pc:"var(--pc)"};
  kpis.forEach(k=>{
    const c=el("div","kpi");
    c.style.setProperty("--accent",tmap[k.tone]||"var(--ferro)");
    c.innerHTML=`<div class="lab">${esc(k.lab)}</div>
      <div class="val">${esc(k.val)}${k.unit?`<span class="u">${esc(k.unit)}</span>`:""}</div>
      ${k.sub?`<div class="sub">${esc(k.sub)}</div>`:""}`;
    g.appendChild(c);
  });
  return g;
}

function buildMap(s){

  if(s.note) aside.appendChild(el("div","note",`<b>Nota</b><span>${esc(s.note)}</span>`));

}

  const div=[68,61,55,47,44,42], ret=[41,38,33,30,27,25];
  const W=720,H=260,P=34, max=72;
  const bw=18,gap=8, group=(W-P*2)/months.length;
  let bars="",labels="",grid="";
  for(let g=0;g<=4;g++){const y=H-P-(g/4)*(H-P*2);grid+=`<line x1="${P}" y1="${y}" x2="${W-P}" y2="${y}" stroke="#efe7d8"/><text x="${P-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#9c8f7d" font-family="IBM Plex Mono">${Math.round(g/4*max)}</text>`;}
  months.forEach((m,i)=>{
    const x0=P+group*i+group/2;
    const hd=(div[i]/max)*(H-P*2), hr=(ret[i]/max)*(H-P*2);
    const xd=x0-bw-gap/2, xr=x0+gap/2;
    bars+=`<rect class="bar" x="${xd}" y="${H-P-hd}" width="${bw}" height="${hd}" rx="3" fill="#5a6b8a"></rect>`;
    bars+=`<rect class="bar" x="${xr}" y="${H-P-hr}" width="${bw}" height="${hr}" rx="3" fill="#b3261e"></rect>`;
    bars+=`<text x="${xd+bw/2}" y="${H-P-hd-5}" text-anchor="middle" font-size="9.5" fill="#5a6b8a" font-family="IBM Plex Mono">${div[i]}</text>`;
    bars+=`<text x="${xr+bw/2}" y="${H-P-hr-5}" text-anchor="middle" font-size="9.5" fill="#b3261e" font-family="IBM Plex Mono">${ret[i]}</text>`;
    labels+=`<text x="${x0}" y="${H-P+18}" text-anchor="middle" font-size="11" fill="#6f6354" font-family="Oswald">${m}</text>`;
  });
  const cw=el("div","chartwrap");
  cw.innerHTML=`<svg viewBox="0 0 ${W} ${H+10}" style="width:100%;height:auto" role="img" aria-label="Gráfico de evolução mensal">${grid}${bars}${labels}</svg>
    <div class="legend"><span><i style="background:#5a6b8a"></i>Divergências</span><span><i style="background:#b3261e"></i>Retrabalho</span></div>`;
  panel.appendChild(cw);
  return panel;
}

/* ============================================================ RENDER ============================================================ */
let current="cover";

function buildNav(){
  const nav=$("#nav");nav.innerHTML="";
  NAV.forEach(group=>{
    nav.appendChild(el("div","nav-group",group.grp));
    group.items.forEach(it=>{
      const b=el("button","nav-item"+(it.id===current?" active":""));
      b.dataset.id=it.id;
      b.innerHTML=`<span class="sigla">${it.sig}</span><span>${esc(it.name)}</span>`;
      b.onclick=()=>go(it.id);
      nav.appendChild(b);
    });
  });
}

function setTopbar(eyebrow,title,subtitle){
  $("#eyebrow").textContent=eyebrow||"Texas Center";
  $("#title").textContent=title||"";
  $("#subtitle").textContent=subtitle||"";
}

function go(id){
  current=id;
  buildNav();
  $("#search").value="";
  closeSide();
  const view=$("#view");view.innerHTML="";view.scrollTop=0;
  $(".scroll").scrollTop=0;

  if(id==="cover"){ setTopbar("Texas Center","Visão geral","Sistema de Gestão de Recebimento, Cadastro e Publicação"); view.appendChild(renderCover()); return; }
  if(id==="flow"){ setTopbar("Mapa de fluxos","Mapa de fluxos","Fluxo nacional e fluxo importado"); view.appendChild(renderFlow()); return; }
  if(id==="nfdetail"){
    setTopbar(NF_DETAIL.eyebrow,NF_DETAIL.title,NF_DETAIL.subtitle);
    const content=el("div","content");
    const left=el("div");left.appendChild(renderNfDetail());
    content.appendChild(left);content.appendChild(buildMap(NF_DETAIL));
    view.appendChild(content);
    return;
  }

  const s=SCREENS[id];
  if(!s){ go("cover"); return; }
  setTopbar(s.eyebrow,s.title,s.subtitle);

  const content=el("div","content");
  const left=el("div");
  if(s.kpis) left.appendChild(buildKpis(s.kpis));
  if(s.chart) left.appendChild(renderChart());
  else left.appendChild(buildTable(s));
  content.appendChild(left);
  content.appendChild(buildMap(s));
  view.appendChild(content);
}

/* ---------- search filters current table ---------- */
$("#search").addEventListener("input",e=>{
  const q=e.target.value.toLowerCase().trim();
  const rows=document.querySelectorAll("#tbody tr");
  rows.forEach(tr=>{tr.style.display=!q||tr.textContent.toLowerCase().includes(q)?"":"none";});
});
$("#export").onclick=()=>{const p=$("#period").value;toast(`Exportação gerada — período: ${p}`);};
$("#period").onchange=e=>toast("Período: "+e.target.value);

/* ---------- toast ---------- */
let tt;
function toast(msg){const t=$("#toast");$("#toast-msg").textContent=msg;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2200);}

/* ---------- mobile sidebar ---------- */
function openSide(){$("#side").classList.add("open");$("#scrim").classList.add("show");}
function closeSide(){$("#side").classList.remove("open");$("#scrim").classList.remove("show");}
$("#hamb").onclick=openSide;
$("#scrim").onclick=closeSide;

/* ---------- init ---------- */
buildNav();
go("cover");
</script>
</body>
</html>
